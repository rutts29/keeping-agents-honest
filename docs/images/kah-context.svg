</style><defs><marker id="ka" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="kah" d="M0 0L10 5L0 10z"/></marker><marker id="kao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="kah o" d="M0 0L10 5L0 10z"/></marker><pattern id="khatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="khl" x1="0" y1="0" x2="0" y2="12"/></pattern></defs><rect class="kbg" x="0" y="0" width="960" height="610" rx="10"/><text class="ktitle" x="28" y="38">kah · system context</text><text class="ksub" x="28" y="58">C4 level 1: who and what kah works with</text><g class="kbox"><rect x="410" y="84" width="236" height="104" rx="18"/><circle cx="436" cy="110" r="9" class="kdia"/><path class="shape" d="M422 134a14 12 0 0 1 28 0z"/></g><text class="kt" x="460" y="110" text-anchor="start">Developer</text><text class="kty" x="460" y="128" text-anchor="start">[Person]</text><text class="kd" x="424" y="155" text-anchor="start">Works in the agent and</text><text class="kd" x="424" y="172" text-anchor="start">states intent in words</text><g class="kbox ext"><rect x="28" y="264" width="236" height="132" rx="6"/><text class="kt" x="42" y="288" text-anchor="start">Coding agent</text><text class="kty" x="42" y="306" text-anchor="start">[Claude Code or Codex]</text><text class="kd" x="42" y="331" text-anchor="start">The unchanged native</text><text class="kd" x="42" y="348" text-anchor="start">client. Does the work</text><text class="kd" x="42" y="365" text-anchor="start">and commits.</text></g><g class="kbox focus"><rect x="410" y="264" width="236" height="132" rx="6"/><text class="kt" x="424" y="288" text-anchor="start">kah</text><text class="kty" x="424" y="306" text-anchor="start">[Software system]</text><text class="kd" x="424" y="331" text-anchor="start">Records the user&#x27;s intent,</text><text class="kd" x="424" y="348" text-anchor="start">checks commits against</text><text class="kd" x="424" y="365" text-anchor="start">it, steers the agent back.</text></g><g class="kbox ext"><rect x="778" y="264" width="156" height="132" rx="6"/><text class="kt" x="792" y="288" text-anchor="start">TypeSafe Jev</text><text class="kty" x="792" y="306" text-anchor="start">[External API]</text><text class="kd" x="792" y="331" text-anchor="start">Typed answers</text><text class="kd" x="792" y="348" text-anchor="start">with probabilities</text></g><g class="kbox ext"><rect x="28" y="486" width="236" height="92" rx="6"/><text class="kt" x="42" y="510" text-anchor="start">Model providers</text><text class="kty" x="42" y="528" text-anchor="start">[Anthropic, OpenAI]</text><text class="kd" x="42" y="553" text-anchor="start">Run the agent&#x27;s models</text></g><path class="ke " d="M410 136H146V264" marker-end="url(#ka)"/><text class="kl khalo" x="170" y="128" text-anchor="start">prompts, steer: and aside:</text><text class="kl" x="170" y="128" text-anchor="start">prompts, steer: and aside:</text><path class="ke " d="M528 188V264" marker-end="url(#ka)"/><text class="kl khalo" x="538" y="232" text-anchor="start">kah commands</text><text class="kl" x="538" y="232" text-anchor="start">kah commands</text><path class="ke " d="M264 300H410" marker-end="url(#ka)"/><text class="kl khalo" x="337" y="274" text-anchor="middle">hook events,</text><text class="kl" x="337" y="274" text-anchor="middle">hook events,</text><text class="kl khalo" x="337" y="291" text-anchor="middle">commits</text><text class="kl" x="337" y="291" text-anchor="middle">commits</text><path class="ke o" d="M410 362H264" marker-end="url(#kao)"/><text class="kl o khalo" x="337" y="384" text-anchor="middle">labelled findings</text><text class="kl o" x="337" y="384" text-anchor="middle">labelled findings</text><text class="kl o khalo" x="337" y="401" text-anchor="middle">and reminders</text><text class="kl o" x="337" y="401" text-anchor="middle">and reminders</text><path class="ke o" d="M646 330H778" marker-end="url(#kao)"/><text class="kl o khalo" x="712" y="303" text-anchor="middle">typed</text><text class="kl o" x="712" y="303" text-anchor="middle">typed</text><text class="kl o khalo" x="712" y="320" text-anchor="middle">questions</text><text class="kl o" x="712" y="320" text-anchor="middle">questions</text><path class="ke " d="M146 396V486" marker-end="url(#ka)"/><text class="kl khalo" x="156" y="446" text-anchor="start">model calls, user&#x27;s login</text><text class="kl" x="156" y="446" text-anchor="start">model calls, user&#x27;s login</text><path class="ke " d="M528 396V532H264" marker-end="url(#ka)"/><text class="kl khalo" x="538" y="452" text-anchor="start">native observer session,</text><text class="kl" x="538" y="452" text-anchor="start">native observer session,</text><text class="kl khalo" x="538" y="469" text-anchor="start">user&#x27;s login</text><text class="kl" x="538" y="469" text-anchor="start">user&#x27;s login</text><text class="kbl" x="760" y="452" text-anchor="start">KEY</text><g class="kbox focus"><rect x="760" y="464" width="34" height="18" rx="3"/></g><text class="kl" x="804" y="478" text-anchor="start">kah</text><g class="kbox ext"><rect x="760" y="490" width="34" height="18" rx="3"/></g><text class="kl" x="804" y="504" text-anchor="start">External system</text><path class="ke " d="M760 525H792" marker-end="url(#ka)"/><text class="kl" x="804" y="530" text-anchor="start">Request or data</text><path class="ke o" d="M760 551H792" marker-end="url(#kao)"/><text class="kl" x="804" y="556" text-anchor="start">Intent and steering</text></svg>