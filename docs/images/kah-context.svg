<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-label="System context. A developer prompts a native coding agent, Claude Code or Codex, and runs kah commands. kah receives the agent&#x27;s hook events and commits and sends labelled findings and reminders back. kah asks the TypeSafe Jev API typed questions. The agent and kah&#x27;s native observer session call the model providers with the user&#x27;s login." font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"><title>kah · system context</title><style>
