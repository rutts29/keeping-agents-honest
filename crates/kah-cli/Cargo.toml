[package]
name = "kah-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "kah"
path = "src/main.rs"

[dependencies]
kah-core = { path = "../kah-core" }
kah-claude = { path = "../kah-claude" }
kah-codex = { path = "../kah-codex" }
kah-sandbox = { path = "../kah-sandbox" }
kah-observer = { path = "../kah-observer" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
kah-run = { path = "../kah-run" }
